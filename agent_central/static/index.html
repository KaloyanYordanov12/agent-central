<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT CENTRAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    :root {
      --bg-deep: #050505;
      --bg-panel: #0a0a0a;
      --bg-elevated: #141414;
      --border: rgba(255, 176, 0, 0.3);
      --border-dim: rgba(255, 176, 0, 0.15);
      --border-bright: #ffb000;
      --text: #ffb000;
      --text-mid: rgba(255, 176, 0, 0.7);
      --text-dim: rgba(255, 176, 0, 0.4);
      --score-low: #ff3030;
      --status-idle: #ffb000;
      --status-running: #00ff41;
      --status-error: #ff3030;
      --status-empty: rgba(255, 176, 0, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, 'Courier New', monospace;
      font-size: 12px;
      padding: 16px;
      display: grid;
      grid-template-rows: 60px 1fr 40px;
      gap: 12px;
      position: relative;
    }

    /* Ambient: scanlines + glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at center, rgba(255, 176, 0, 0.06) 0%, transparent 70%);
      pointer-events: none;
      animation: glow-pulse 8s ease-in-out infinite alternate;
    }
    @keyframes glow-pulse {
      from { opacity: 1; }
      to   { opacity: 0.4; }
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 2px,
        rgba(255, 176, 0, 0.025) 2px, rgba(255, 176, 0, 0.025) 3px
      );
      pointer-events: none;
      animation: scanline-drift 60s linear infinite;
    }
    @keyframes scanline-drift {
      from { background-position-y: 0; }
      to   { background-position-y: 100%; }
    }

    /* Top bar */
    .top-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 0 16px;
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      user-select: none;
    }
    .cursor {
      display: inline-block;
      color: var(--text);
      animation: cursor-blink 1s steps(2) infinite;
    }
    @keyframes cursor-blink {
      50% { opacity: 0; }
    }
    .stats {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
      color: var(--text-mid);
      font-size: 12px;
      flex-wrap: wrap;
    }
    .stat {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .sep {
      color: var(--text-dim);
      opacity: 0.5;
    }

    /* Game canvas mount point */
    .game-main {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      overflow: hidden;
      min-height: 0;
    }
    #game-container {
      line-height: 0;
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    /* Bottom bar */
    .bottom-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: var(--text-dim);
    }
    .version {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .sound-toggle {
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    .sound-toggle:hover {
      background: var(--bg-elevated);
    }

    /* Narrow viewport — collapse 4-col grid to 2-col */
    @media (max-width: 900px) {
      html, body { height: auto; overflow: auto; }
      body {
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }
      .top-bar {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        padding: 12px 16px;
        gap: 8px;
      }
      .stats {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">AGENT CENTRAL<span class="cursor">▌</span></div>
    <div class="stats">
      <span class="stat"><span class="stat-label">SLOTS</span> <span id="stat-slots">0 / 10</span></span>
      <span class="sep">|</span>
      <span class="stat"><span class="stat-label">ONLINE</span> <span id="stat-online">—</span></span>
      <span class="sep">|</span>
      <span class="stat"><span class="stat-label">UPTIME</span> <span id="stat-uptime">—</span></span>
    </div>
  </header>

  <main class="game-main">
    <div id="game-container"></div>
  </main>

  <footer class="bottom-bar">
    <span class="version">v0.1.0 — agent central</span>
    <button class="sound-toggle" type="button">♪ SOUND: ON</button>
  </footer>

  <script>
    // ============================================================
    // ZONE MAP — five agent zones with (x, y) waypoints where the character stands.
    // floor: 'upper' or 'lower' — controls elevator routing during cross-floor walks.
    // Coordinates are estimates within the 656×320 native canvas; tune visually.
    // ============================================================
    const ZONE_MAP = {
      operations:     { x: 90,  y: 130, floor: 'upper', label: 'OPERATIONS' },
      communications: { x: 230, y: 130, floor: 'upper', label: 'COMMUNICATIONS' },
      writingDesk:    { x: 420, y: 130, floor: 'upper', label: 'WRITING DESK' },
      lounge:         { x: 130, y: 290, floor: 'lower', label: 'LOUNGE' },
      research:       { x: 510, y: 290, floor: 'lower', label: 'RESEARCH' },
    };

    const ELEVATOR_UPPER = { x: 90, y: 130 };
    const ELEVATOR_LOWER = { x: 90, y: 290 };

    const WALK_SPEED = 80; // native pixels per second

    function updateStatusText(scene) {
      const zone = ZONE_MAP[scene.currentZone];
      const state = scene.isWalking ? 'walking' : 'idle';
      scene.statusText.setText(
        `AGENT: deal_hunter\nZONE: ${zone.label}\nSTATE: ${state}`
      );
    }

    function walkToZone(scene, zoneKey) {
      if (scene.isWalking) return;
      const target = ZONE_MAP[zoneKey];
      if (!target) return;
      if (zoneKey === scene.currentZone) return;

      const currentZoneData = ZONE_MAP[scene.currentZone];
      scene.isWalking = true;
      updateStatusText(scene);

      const finishAtTarget = () => {
        scene.currentZone = zoneKey;
        scene.isWalking = false;
        updateStatusText(scene);
      };

      if (currentZoneData.floor === target.floor) {
        // Same floor — walk straight across.
        const distance = Math.abs(target.x - scene.dealHunter.x);
        const duration = (distance / WALK_SPEED) * 1000;
        scene.tweens.add({
          targets: scene.dealHunter,
          x: target.x,
          duration: duration,
          ease: 'Linear',
          onComplete: finishAtTarget,
        });
        return;
      }

      // Cross-floor — walk to elevator on current floor, teleport, walk to target on other floor.
      const currentElevator = currentZoneData.floor === 'upper' ? ELEVATOR_UPPER : ELEVATOR_LOWER;
      const otherElevator   = currentZoneData.floor === 'upper' ? ELEVATOR_LOWER : ELEVATOR_UPPER;

      const distanceToElevator   = Math.abs(currentElevator.x - scene.dealHunter.x);
      const distanceFromElevator = Math.abs(target.x - otherElevator.x);
      const durationToElevator   = (distanceToElevator   / WALK_SPEED) * 1000;
      const durationFromElevator = (distanceFromElevator / WALK_SPEED) * 1000;

      scene.tweens.add({
        targets: scene.dealHunter,
        x: currentElevator.x,
        duration: durationToElevator,
        ease: 'Linear',
        onComplete: () => {
          // "Use the elevator" — teleport to the other floor's matching elevator slot.
          scene.dealHunter.x = otherElevator.x;
          scene.dealHunter.y = otherElevator.y;

          scene.tweens.add({
            targets: scene.dealHunter,
            x: target.x,
            duration: durationFromElevator,
            ease: 'Linear',
            onComplete: finishAtTarget,
          });
        },
      });
    }

    const officeScene = {
      key: 'OfficeScene',
      preload() {
        this.load.image(
          'rixitic-example',
          '/static/assets/tilesets/rixitic-sidescroller-office/example.png'
        );
        this.load.image(
          '2dpig-characters',
          '/static/assets/tilesets/2dpig-pixel-office/PixelOfficeAssets.png'
        );
      },
      create() {
        // Rixitic example scene as the permanent office background.
        const cx = this.scale.width / 2;
        const cy = this.scale.height / 2;
        this.add.image(cx, cy, 'rixitic-example');

        // Register the dark-haired character sprite from the 2dPig sheet.
        this.textures.get('2dpig-characters').add('deal-hunter', 0, 2, 96, 14, 24);

        // Spawn Deal Hunter at the Operations zone.
        // Bottom-center origin so the y-coordinate is the floor where the character stands.
        const startZone = ZONE_MAP.operations;
        this.dealHunter = this.add.image(startZone.x, startZone.y, '2dpig-characters', 'deal-hunter');
        this.dealHunter.setOrigin(0.5, 1);
        this.currentZone = 'operations';
        this.isWalking = false;

        // Status overlay — amber text in top-left of the canvas.
        this.statusText = this.add.text(8, 8, '', {
          fontFamily: '"JetBrains Mono", monospace',
          fontSize: '8px',
          color: '#ffb000',
          align: 'left',
        }).setOrigin(0, 0);
        updateStatusText(this);

        // Debug keyboard shortcuts — 1..5 walk Deal Hunter to each zone.
        this.input.keyboard.on('keydown-ONE',   () => walkToZone(this, 'operations'));
        this.input.keyboard.on('keydown-TWO',   () => walkToZone(this, 'communications'));
        this.input.keyboard.on('keydown-THREE', () => walkToZone(this, 'writingDesk'));
        this.input.keyboard.on('keydown-FOUR',  () => walkToZone(this, 'lounge'));
        this.input.keyboard.on('keydown-FIVE',  () => walkToZone(this, 'research'));
      },
    };

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 656,
      height: 320,
      zoom: 2,
      backgroundColor: '#050505',
      pixelArt: true,
      scene: officeScene,
    };

    window.addEventListener('DOMContentLoaded', () => {
      new Phaser.Game(config);
    });
  </script>

</body>
</html>
