<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT CENTRAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    :root {
      --bg-deep: #050505;
      --bg-panel: #0a0a0a;
      --bg-elevated: #141414;
      --border: rgba(255, 176, 0, 0.3);
      --border-dim: rgba(255, 176, 0, 0.15);
      --border-bright: #ffb000;
      --text: #ffb000;
      --text-mid: rgba(255, 176, 0, 0.7);
      --text-dim: rgba(255, 176, 0, 0.4);
      --score-low: #ff3030;
      --status-idle: #ffb000;
      --status-running: #00ff41;
      --status-error: #ff3030;
      --status-empty: rgba(255, 176, 0, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
    }

    body {
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, 'Courier New', monospace;
    }

    /* World wrapper fills the viewport — backdrop image provides sky, lawn,
       fountain, city skyline, and a contextual corporate building on the right.
       Flex positions the rixitic building in the center-left area. */
    .world-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background-image: url('/static/assets/backgrounds/world-bg-v2.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #7ec0e8; /* fallback while image loads */
    }

    /* Rixitic building positioned over the fountain/lawn (center-left).
       The image's own corporate building (right side) becomes contextual scenery. */
    .building {
      position: relative;
      display: inline-block;
      margin-left: 18vw;
      border: 12px solid #6e6e6e;
      border-top: 22px solid #4a4a4a;
      background:
        repeating-linear-gradient(
          to right,
          #4a4a4a 0px,
          #4a4a4a 60px,
          #5a5a5a 60px,
          #5a5a5a 120px
        );
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.6),
        inset 8px 0 0 rgba(255, 255, 255, 0.05),
        inset -8px 0 0 rgba(0, 0, 0, 0.15),
        inset 0 0 60px rgba(0, 0, 0, 0.3);
    }

    .building::before {
      content: '';
      position: absolute;
      top: -22px;
      left: -12px;
      right: -12px;
      height: 22px;
      background: linear-gradient(to bottom, #5a5a5a 0%, #3a3a3a 100%);
      z-index: 1;
      pointer-events: none;
    }

    .building-sign {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d4a5c;
      color: #f4f0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 8px 24px;
      border: 2px solid #1a3445;
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      z-index: 10;
    }
    .building-sign::before,
    .building-sign::after {
      content: '';
      position: absolute;
      bottom: -22px;
      width: 3px;
      height: 22px;
      background: #555;
    }
    .building-sign::before { left: 20%; }
    .building-sign::after  { right: 20%; }

    .status-overlay {
      position: absolute;
      top: 30px;
      left: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffb000;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 4px 6px;
      z-index: 10;
      white-space: pre-line;
      line-height: 1.4;
      pointer-events: none;
    }

    #game-container {
      line-height: 0;
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>

  <div class="world-wrapper">
    <div class="building">
      <div class="building-sign">AGENT CENTRAL</div>
      <div class="status-overlay" id="status-overlay">AGENT: deal_hunter
ZONE: OPERATIONS
STATE: idle</div>
      <div id="game-container"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // ZONE MAP — five agent zones with (x, y) waypoints where the character stands.
    // floor: 'upper' or 'lower' — controls elevator routing during cross-floor walks.
    // Coordinates are estimates within the 656×320 native canvas; tune visually.
    // ============================================================
    const ZONE_MAP = {
      operations:     { x: 90,  y: 130, floor: 'upper', label: 'OPERATIONS' },
      communications: { x: 230, y: 130, floor: 'upper', label: 'COMMUNICATIONS' },
      writingDesk:    { x: 420, y: 130, floor: 'upper', label: 'WRITING DESK' },
      lounge:         { x: 130, y: 290, floor: 'lower', label: 'LOUNGE' },
      research:       { x: 510, y: 290, floor: 'lower', label: 'RESEARCH' },
    };

    const ELEVATOR_UPPER = { x: 90, y: 130 };
    const ELEVATOR_LOWER = { x: 90, y: 290 };

    const WALK_SPEED = 80; // native pixels per second

    // Maps Deal Hunter pipeline states to zones for autonomous walking.
    const STATE_TO_ZONE = {
      scanning:        'research',
      qualifying:      'operations',
      author_research: 'research',
      writing:         'writingDesk',
      critic:          'writingDesk',
      posting:         'communications',
      idle:            'lounge',
      offline:         null,
    };

    let pendingDestination = null; // queued state changes during walks
    let isOffline = false;

    function applyAgentState(scene, payload) {
      const state = payload.state;
      const action = payload.current_action || '';
      isOffline = (state === 'offline');

      const zone = ZONE_MAP[scene.currentZone];
      const stateLine = isOffline
        ? 'STATE: offline'
        : `STATE: ${scene.isWalking ? 'walking' : 'idle'} (${state})`;
      const overlay = document.getElementById('status-overlay');
      overlay.textContent = `AGENT: deal_hunter\nZONE: ${zone.label}\n${stateLine}\nACTION: ${action}`;
      overlay.style.color = isOffline ? '#ff3b30' : '#ffb000';

      if (isOffline) return;

      const targetZone = STATE_TO_ZONE[state];
      if (!targetZone) return;
      if (targetZone === scene.currentZone) return;

      if (scene.isWalking) {
        pendingDestination = targetZone;
      } else {
        walkToZone(scene, targetZone);
      }
    }

    function consumePendingDestination(scene) {
      if (pendingDestination && pendingDestination !== scene.currentZone) {
        const next = pendingDestination;
        pendingDestination = null;
        walkToZone(scene, next);
      }
    }

    function updateStatusText(scene) {
      const zone = ZONE_MAP[scene.currentZone];
      const state = scene.isWalking ? 'walking' : 'idle';
      const overlay = document.getElementById('status-overlay');
      overlay.textContent = `AGENT: deal_hunter\nZONE: ${zone.label}\nSTATE: ${state}`;
    }

    function walkToZone(scene, zoneKey) {
      if (scene.isWalking) return;
      const target = ZONE_MAP[zoneKey];
      if (!target) return;
      if (zoneKey === scene.currentZone) return;

      const currentZoneData = ZONE_MAP[scene.currentZone];
      scene.isWalking = true;
      updateStatusText(scene);

      const finishAtTarget = () => {
        scene.currentZone = zoneKey;
        scene.isWalking = false;
        updateStatusText(scene);
        consumePendingDestination(scene);
      };

      if (currentZoneData.floor === target.floor) {
        const distance = Math.abs(target.x - scene.dealHunter.x);
        const duration = (distance / WALK_SPEED) * 1000;
        scene.tweens.add({
          targets: scene.dealHunter,
          x: target.x,
          duration: duration,
          ease: 'Linear',
          onComplete: finishAtTarget,
        });
        return;
      }

      // Cross-floor — walk to elevator on current floor, teleport, walk to target on other floor.
      const currentElevator = currentZoneData.floor === 'upper' ? ELEVATOR_UPPER : ELEVATOR_LOWER;
      const otherElevator   = currentZoneData.floor === 'upper' ? ELEVATOR_LOWER : ELEVATOR_UPPER;

      const distanceToElevator   = Math.abs(currentElevator.x - scene.dealHunter.x);
      const distanceFromElevator = Math.abs(target.x - otherElevator.x);
      const durationToElevator   = (distanceToElevator   / WALK_SPEED) * 1000;
      const durationFromElevator = (distanceFromElevator / WALK_SPEED) * 1000;

      scene.tweens.add({
        targets: scene.dealHunter,
        x: currentElevator.x,
        duration: durationToElevator,
        ease: 'Linear',
        onComplete: () => {
          // "Use the elevator" — teleport to the other floor's matching elevator slot.
          scene.dealHunter.x = otherElevator.x;
          scene.dealHunter.y = otherElevator.y;

          scene.tweens.add({
            targets: scene.dealHunter,
            x: target.x,
            duration: durationFromElevator,
            ease: 'Linear',
            onComplete: finishAtTarget,
          });
        },
      });
    }

    const officeScene = {
      key: 'OfficeScene',
      preload() {
        this.load.image(
          'rixitic-example',
          '/static/assets/tilesets/rixitic-sidescroller-office/example-transparent.png'
        );
        this.load.image(
          '2dpig-characters',
          '/static/assets/tilesets/2dpig-pixel-office/PixelOfficeAssets.png'
        );
      },
      create() {
        // Rixitic example scene as the permanent office background.
        // World layers (sky, sun, grass, dirt, walls, roof) are CSS around the
        // canvas — see <div class="world-wrapper"> in HTML. Phaser only renders
        // the office and character here.
        const cx = this.scale.width / 2;
        const cy = this.scale.height / 2;
        this.add.image(cx, cy, 'rixitic-example');

        // Register the dark-haired character sprite from the 2dPig sheet.
        this.textures.get('2dpig-characters').add('deal-hunter', 0, 2, 96, 14, 24);

        // Spawn Deal Hunter at the Operations zone.
        const startZone = ZONE_MAP.operations;
        this.dealHunter = this.add.image(startZone.x, startZone.y, '2dpig-characters', 'deal-hunter');
        this.dealHunter.setOrigin(0.5, 1);
        this.currentZone = 'operations';
        this.isWalking = false;

        // Status overlay is an HTML div (#status-overlay) updated via
        // updateStatusText/applyAgentState — keeps it readable over a transparent canvas.
        updateStatusText(this);

        // Debug keyboard shortcuts — 1..5 walk Deal Hunter to each zone.
        this.input.keyboard.on('keydown-ONE',   () => walkToZone(this, 'operations'));
        this.input.keyboard.on('keydown-TWO',   () => walkToZone(this, 'communications'));
        this.input.keyboard.on('keydown-THREE', () => walkToZone(this, 'writingDesk'));
        this.input.keyboard.on('keydown-FOUR',  () => walkToZone(this, 'lounge'));
        this.input.keyboard.on('keydown-FIVE',  () => walkToZone(this, 'research'));

        // WebSocket connection to Agent Central backend — receives Deal Hunter state.
        const scene = this;
        let ws;
        function connectWS() {
          ws = new WebSocket('ws://127.0.0.1:8001/ws/status');
          ws.onopen = () => console.log('[WS] connected');
          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'status') {
                applyAgentState(scene, msg.payload);
              }
            } catch (e) {
              console.error('[WS] failed to parse message:', e);
            }
          };
          ws.onclose = () => {
            console.warn('[WS] disconnected, retrying in 3s...');
            setTimeout(connectWS, 3000);
          };
          ws.onerror = (e) => console.error('[WS] error:', e);
        }
        connectWS();
      },
    };

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 656,
      height: 320,
      zoom: 1.5,
      transparent: true,
      backgroundColor: 'rgba(0, 0, 0, 0)',
      pixelArt: true,
      scene: officeScene,
    };

    window.addEventListener('DOMContentLoaded', () => {
      new Phaser.Game(config);
    });
  </script>

</body>
</html>
