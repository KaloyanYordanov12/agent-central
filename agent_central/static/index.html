<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT CENTRAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <style>
    :root {
      --bg-deep: #050505;
      --bg-panel: #0a0a0a;
      --bg-elevated: #141414;
      --border: rgba(255, 176, 0, 0.3);
      --border-dim: rgba(255, 176, 0, 0.15);
      --border-bright: #ffb000;
      --text: #ffb000;
      --text-mid: rgba(255, 176, 0, 0.7);
      --text-dim: rgba(255, 176, 0, 0.4);
      --score-low: #ff3030;
      --status-idle: #ffb000;
      --status-running: #00ff41;
      --status-error: #ff3030;
      --status-empty: rgba(255, 176, 0, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, 'Courier New', monospace;
      font-size: 12px;
      padding: 16px;
      display: grid;
      grid-template-rows: 60px 1fr 40px;
      gap: 12px;
      position: relative;
    }

    /* Ambient: scanlines + glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at center, rgba(255, 176, 0, 0.06) 0%, transparent 70%);
      pointer-events: none;
      animation: glow-pulse 8s ease-in-out infinite alternate;
    }
    @keyframes glow-pulse {
      from { opacity: 1; }
      to   { opacity: 0.4; }
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 2px,
        rgba(255, 176, 0, 0.025) 2px, rgba(255, 176, 0, 0.025) 3px
      );
      pointer-events: none;
      animation: scanline-drift 60s linear infinite;
    }
    @keyframes scanline-drift {
      from { background-position-y: 0; }
      to   { background-position-y: 100%; }
    }

    /* Top bar */
    .top-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 0 16px;
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      user-select: none;
    }
    .cursor {
      display: inline-block;
      color: var(--text);
      animation: cursor-blink 1s steps(2) infinite;
    }
    @keyframes cursor-blink {
      50% { opacity: 0; }
    }
    .stats {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
      color: var(--text-mid);
      font-size: 12px;
      flex-wrap: wrap;
    }
    .stat {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .sep {
      color: var(--text-dim);
      opacity: 0.5;
    }

    /* Game canvas mount point */
    .game-main {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      overflow: hidden;
      min-height: 0;
    }
    #game-container {
      line-height: 0;
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    /* Bottom bar */
    .bottom-bar {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: var(--text-dim);
    }
    .version {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .sound-toggle {
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    .sound-toggle:hover {
      background: var(--bg-elevated);
    }

    /* Narrow viewport — collapse 4-col grid to 2-col */
    @media (max-width: 900px) {
      html, body { height: auto; overflow: auto; }
      body {
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }
      .top-bar {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        padding: 12px 16px;
        gap: 8px;
      }
      .stats {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">AGENT CENTRAL<span class="cursor">▌</span></div>
    <div class="stats">
      <span class="stat"><span class="stat-label">SLOTS</span> <span id="stat-slots">0 / 10</span></span>
      <span class="sep">|</span>
      <span class="stat"><span class="stat-label">ONLINE</span> <span id="stat-online">—</span></span>
      <span class="sep">|</span>
      <span class="stat"><span class="stat-label">UPTIME</span> <span id="stat-uptime">—</span></span>
    </div>
  </header>

  <main class="game-main">
    <div id="game-container"></div>
  </main>

  <footer class="bottom-bar">
    <span class="version">v0.1.0 — agent central</span>
    <button class="sound-toggle" type="button">♪ SOUND: ON</button>
  </footer>

  <script>
    const officeScene = {
      key: 'OfficeScene',
      preload() {
        this.load.image(
          'office-sample',
          '/static/assets/tilesets/2dpig-pixel-office/PixelOffice.png'
        );
      },
      create() {
        const cx = this.scale.width / 2;
        const cy = this.scale.height / 2;
        this.add.image(cx, cy, 'office-sample');
      },
    };

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 256,
      height: 224,
      backgroundColor: '#050505',
      pixelArt: true,
      scene: officeScene,
    };

    window.addEventListener('DOMContentLoaded', () => {
      new Phaser.Game(config);
    });
  </script>

</body>
</html>
