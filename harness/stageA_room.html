<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stage A - one room at 4x</title>
<style>
  /* Throwaway harness. Renders ONE Pixel Spaces room cell at 4x from the real
     copied tiles. Two cells side by side: ROAMING (agent standing beside the
     desk, legs visible) vs WORKING (agent behind the desk-front, legs occluded,
     monitor lit, status bubble). All positions are NATIVE px; one CSS transform
     does the 4x zoom; image-rendering keeps the pixels crisp. */
  :root { --scale: 4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #14161c; color: #cfd2dc;
    font-family: 'Consolas','JetBrains Mono',monospace; padding: 24px 28px;
  }
  h1 { font-size: 15px; font-weight: 600; color: #7cc8ff; margin-bottom: 4px; }
  p.sub { font-size: 12px; color: #8b92a4; margin-bottom: 22px; }
  .row { display: flex; gap: 60px; align-items: flex-start; }
  .cell { }
  .cell .label { font-size: 12px; color: #cfd2dc; margin-bottom: 8px; letter-spacing: 1px; }

  /* The room cell: 128 x 80 native, scaled 4x. */
  .stage {
    position: relative;
    width: 128px; height: 80px;
    transform: scale(var(--scale));
    transform-origin: top left;
    image-rendering: pixelated;
  }
  /* Reserve the scaled footprint so the two cells lay out side by side. */
  .holder { width: 512px; height: 320px; }

  .stage img, .stage .agent {
    position: absolute;
    image-rendering: pixelated;
    image-rendering: -webkit-optimize-contrast;
  }

  /* Room shell: flat fill in the Pixel Spaces room-shell navy (sampled from
     Infrastructure.png; the shells are single-color boxes, so a fill is the
     same as tiling one - "plain is fine for Stage A"). */
  .wall  { position:absolute; left:0; top:0;  width:128px; height:30px; background:#5f6183; }
  .floor { position:absolute; left:0; top:30px; width:128px; height:50px; background:#373964; }
  .base  { position:absolute; left:0; top:29px; width:128px; height:1px;  background:#2a2c4a; }

  /* Agent: one 32x32 frame from the NPC sheet via background-position. */
  .agent {
    width: 32px; height: 32px;
    background-image: url('../agent_central/static/assets/pixelspaces/npc/agent1.png');
    background-size: 160px 96px;     /* native sheet size, so offsets are native px */
    background-repeat: no-repeat;
  }
  .agent.idle { background-position: 0px -32px; }   /* row1 col0 = idle */
  .agent.walk { background-position: -32px 0px; }   /* row0 col1 = mid-stride */

  /* Lit-screen overlay (the "working" tell) over the monitor's screen area. */
  .screenlit {
    position:absolute; width:8px; height:4px; border-radius:1px;
    background: #5ce0ff;
    box-shadow: 0 0 2px 1px rgba(92,224,255,0.8);
  }
  /* Status bubble above the working agent. */
  .bubble {
    position:absolute; width:18px; height:9px; border-radius:3px;
    background:#f4f0e0; border:1px solid #243845;
  }
  .bubble::after {
    content:''; position:absolute; left:6px; top:3px; width:6px; height:2px;
    background:#243845; box-shadow:0 0 0 0 #243845;
  }
</style>
</head>
<body>
  <h1>STAGE A - one Pixel Spaces room at 4x</h1>
  <p class="sub">Left: roaming pose (standing beside the desk, legs visible). Right: seated-at-desk illusion (behind the desk-front, legs occluded) with a lit monitor and a status bubble.</p>

  <div class="row">
    <!-- ROAMING -->
    <div class="cell">
      <div class="label">ROAMING (idle / walking the floor)</div>
      <div class="holder"><div class="stage">
        <div class="wall"></div><div class="base"></div><div class="floor"></div>
        <!-- back furniture -->
        <img src="../agent_central/static/assets/pixelspaces/furniture/Bookshelf_1.png" style="left:8px; top:33px; z-index:1;">
        <img src="../agent_central/static/assets/pixelspaces/objects/Flora_bonsai.png" style="left:106px; top:55px; z-index:1;">
        <!-- desk cluster on the left -->
        <img src="../agent_central/static/assets/pixelspaces/furniture/Officechair_blue.png" style="left:34px; top:55px; z-index:1;">
        <img src="../agent_central/static/assets/pixelspaces/furniture/Drawerdesk.png" style="left:24px; top:61px; z-index:3;">
        <img src="../agent_central/static/assets/pixelspaces/objects/Monitor.png" style="left:32px; top:53px; z-index:4;">
        <img src="../agent_central/static/assets/pixelspaces/objects/Desk_lamp.png" style="left:46px; top:53px; z-index:4;">
        <!-- agent standing beside the desk, full body visible -->
        <div class="agent walk" style="left:84px; top:40px; z-index:2;"></div>
      </div></div>
    </div>

    <!-- WORKING -->
    <div class="cell">
      <div class="label">WORKING (seated behind desk-front, monitor lit)</div>
      <div class="holder"><div class="stage">
        <div class="wall"></div><div class="base"></div><div class="floor"></div>
        <!-- back furniture -->
        <img src="../agent_central/static/assets/pixelspaces/furniture/Bookshelf_1.png" style="left:8px; top:33px; z-index:1;">
        <img src="../agent_central/static/assets/pixelspaces/objects/Flora_bonsai.png" style="left:106px; top:55px; z-index:1;">
        <!-- chair behind the agent -->
        <img src="../agent_central/static/assets/pixelspaces/furniture/Officechair_blue.png" style="left:56px; top:55px; z-index:1;">
        <!-- agent seated: standing idle frame, head/torso show above the desk,
             lower body occluded by the desk-front -->
        <div class="agent idle" style="left:50px; top:39px; z-index:2;"></div>
        <!-- desk-front IN FRONT of the agent (higher z) -> occludes the legs -->
        <img src="../agent_central/static/assets/pixelspaces/furniture/Drawerdesk.png" style="left:52px; top:61px; z-index:3;">
        <!-- monitor sits LEFT on the desk (not over the agent's face); lamp right -->
        <img src="../agent_central/static/assets/pixelspaces/objects/Monitor.png" style="left:54px; top:55px; z-index:4;">
        <img src="../agent_central/static/assets/pixelspaces/objects/Desk_lamp.png" style="left:70px; top:55px; z-index:4;">
        <!-- lit screen + status bubble = "working" -->
        <div class="screenlit" style="left:56px; top:56px; z-index:5;"></div>
        <div class="bubble" style="left:58px; top:30px; z-index:6;"></div>
      </div></div>
    </div>
  </div>
</body>
</html>
